name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run package -- --config.directories.output=.local/ci-package
      - name: Install browser and test media tools
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe")) {
            npx playwright install chrome
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify the editor and both export targets
        shell: pwsh
        run: |
          $env:FRAMEFORGE_TEST_EXECUTABLE = (Resolve-Path '.local/ci-package/win-unpacked/FrameForge.exe').Path
          npm run test:e2e -- tests/e2e/editor.spec.ts tests/e2e/new-project.spec.ts tests/e2e/desktop.spec.ts tests/e2e/web-export.spec.ts
      - name: Archive Windows x64 portable build
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $package = '.local/ci-package/win-unpacked'
          $zip = ".local/FrameForge-v${version}-windows-x64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: |
            .local/FrameForge-*-windows-x64.zip
            .local/FrameForge-*-windows-x64.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
